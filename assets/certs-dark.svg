<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" role="img" aria-labelledby="t d">
<title id="t">Certifications</title>
<desc id="d">Certifications: Associate Cloud Engineer, Google Cloud, issued Aug 30, 2025, valid until Aug 30, 2028; AWS Certified Cloud Practitioner, Amazon Web Services, issued Apr 8, 2026, valid until Apr 8, 2029; Certified Partner Specialist: Gemini Enterprise Agent Development, Google Cloud, issued Sep 20, 2026, valid until Mar 20, 2027.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#fff}.kick{font-size:10px;font-weight:700;fill-opacity:.75}.name{font-weight:700}.sub{font-size:11.5px;fill-opacity:.75}.meta{font-size:9.5px;font-weight:600;letter-spacing:1px;fill-opacity:.6}.float{animation:float 5s ease-in-out infinite alternate}.holo{animation:holo 9s ease-in-out infinite alternate}.shine{animation:sweep 5.5s ease-in-out infinite}@keyframes float{to{transform:translateY(-7px)}}@keyframes holo{to{transform:translateX(176px)}}@keyframes sweep{0%{transform:translateX(0)}30%,100%{transform:translateX(440px)}}@media (prefers-reduced-motion:reduce){.float,.holo,.shine{animation:none}}</style>
